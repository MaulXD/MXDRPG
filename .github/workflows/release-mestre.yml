name: Release — Assistente do Mestre

on:
  push:
    tags:
      - "v*-mestre"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: mxdrpg-mestre-windows.exe
          - goos: darwin
            goarch: amd64
            asset: mxdrpg-mestre-mac-intel
          - goos: darwin
            goarch: arm64
            asset: mxdrpg-mestre-mac-silicon
          - goos: linux
            goarch: amd64
            asset: mxdrpg-mestre-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build
        working-directory: cmd/mestre
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o ../../${{ matrix.asset }} .

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Assistente do Mestre ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: ${{ matrix.asset }}
