name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - "livros/**"
              - "scripts/generate-*.mjs"
              - "scripts/sync-*.mjs"
              - "scripts/gen-*.py"
              - "scripts/verify-compendium-*.mjs"
              - "scripts/verify-monster-*.mjs"
              - "data/compendiums/**"
              - "data/character/subclass-tracks.json"
              - "lib/character/loot-catalog.ts"

  data-sync:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.data == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Regenerate data from books
        run: npm run sync:data

      - name: Verify compendium IDs
        run: npm run sync:data:check

      - name: Data matches committed files
        run: |
          git diff --exit-code data/compendiums/ data/character/subclass-tracks.json lib/character/loot-catalog.ts livros/TABELA-IDS-ELDARIN.md || (
            echo "Run npm run sync:data locally and commit generated files."
            exit 1
          )

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
